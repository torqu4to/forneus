[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forneus-core"
version = "0.2.0"
description = "Shared core for forneus.wiki - optimization tools for Tree of Savior Neo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Forneus" }]

[project.urls]
Homepage = "https://forneus.wiki"

[project.scripts]
forneus-amigatos = "forneus_core.tools.amigatos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# numpy is an OPTIONAL accelerator for the solver, not a requirement: without
# it the package returns identical numbers via the pure-Python path, just far
# slower (~21 s vs ~0.65 s on the worst reachable case). Tests assert the two
# agree; CI should run at least one job without it.
fast = ["numpy>=1.24"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "numpy>=1.24"]
dev = ["pytest", "flask>=3.0,<4", "jsonschema>=4", "numpy>=1.24",
       "fastapi>=0.110", "httpx>=0.27"]
web = ["flask>=3.0,<4"]

[tool.setuptools.package-data]
forneus_core = [
    "templates/*.html",
    "static/*.css",
    "static/*.js",
    "locales/*.json",
    "data/*/*.json",
    "data/_schema/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
